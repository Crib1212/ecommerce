
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | WittyFare</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f8f2;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 25px #0001;
        }

        h2 { color: #238b3a; text-align: center; }
        p { color: #666; text-align: center; }

        input, button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 7px;
            font-size: 16px;
        }

        input { border: 1px solid #ccc; }

        button {
            border: 0;
            color: white;
            background: #28a745;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { opacity: .6; }

        #message {
            color: #c62828;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h2>WittyFare Admin</h2>
        <p>Sign in to manage customer payments.</p>

        <form id="loginForm">
            <input
                type="password"
                id="password"
                placeholder="Administrator password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Sign In
            </button>
        </form>

        <div id="message" role="alert"></div>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const button = document.getElementById('loginButton');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = 'Signing in...';
            message.textContent = '';

            try {
                const response = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        password: document.getElementById('password').value
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Login failed.');
                }

                window.location.href = '/admin/payments.html';

            } catch (error) {
                message.textContent = error.message;
                button.disabled = false;
                button.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
