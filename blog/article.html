
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>WittyFare Article</title>

    <meta name="description"
        content="Read useful guides and articles on WittyFare.">

    <link rel="stylesheet" href="blog.css">

</head>

<body>

<header class="blog-header">

    <a href="../index.html" class="blog-logo">
        WittyFare
    </a>

    <nav class="blog-nav">

        <a href="index.html">Blog Home</a>

        <a href="../index.html">Store</a>

    </nav>

</header>


<main class="single-article">

    <div class="breadcrumbs">

        <a href="../index.html">Home</a>

        /

        <a href="index.html">Blog</a>

        /

        <span id="articleBreadcrumb">Article</span>

    </div>


    <article id="articleDetails">

        <p id="articleCategory" class="article-category"></p>

        <h1 id="articleTitle">
            Loading article...
        </h1>

        <p id="articleDescription"></p>

        <div class="article-meta">

            <span id="articleAuthor"></span>

            |

            <span id="articleDate"></span>

        </div>


        <img
            id="articleImage"
            class="single-article-image"
            src=""
            alt=""
        >


        <div id="articleContent" class="article-content">

        </div>

    </article>


    <section class="related-articles">

        <h2>Related Articles</h2>

        <div id="relatedArticles" class="article-grid">

        </div>

    </section>

</main>


<footer class="blog-footer">

    <h3>WittyFare</h3>

    <a href="index.html">Blog Home</a>

    <a href="../index.html">Visit Store</a>

</footer>


<script src="blog.js"></script>

</body>
</html>
