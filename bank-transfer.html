<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Transfer | WittyFare Agrovet & Farms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="checkout-container">
        <h1>Complete Your Bank Transfer</h1>
        <p>Your order has been prepared. Please transfer the exact amount below.</p>

        <section class="checkout-card">
            <h2>WittyFare Bank Account</h2>

            <p><strong>Bank:</strong> <span id="bankName">moniepoint</span></p>
            <p><strong>Account name:</strong> <span id="accountName">wittyfare services</span></p>
            <p><strong>Account number:</strong> <span id="accountNumber">6711391485</span></p>

            <hr>

            <p>Order amount</p>
            <h2 id="transferAmount">Loading...</h2>

            <p id="transferStatus"></p>

            <button type="button" id="copyAccount">Copy Account Number</button>
            <a href="index.html">Continue Shopping</a>
        </section>
    </main>

    <script>
    (() => {
        const orderText = sessionStorage.getItem("currentOrder");
        const status = document.getElementById("transferStatus");

        if (!orderText) {
            document.getElementById("transferAmount").textContent =
                "Order details unavailable";
            status.textContent =
                "Please return to checkout and place your order again.";
            document.getElementById("copyAccount").disabled = true;
            return;
        }

        try {
            const order = JSON.parse(orderText);

            if (!Number.isFinite(Number(order.totalPrice)) ||
                Number(order.totalPrice) < 0 ||
                order.paymentMethod !== "transfer") {
                throw new Error("Invalid transfer order");
            }

            document.getElementById("transferAmount").textContent =
                "₦" + Number(order.totalPrice).toLocaleString("en-NG");

            status.textContent =
                "Payment status: Pending. Your order is not yet marked as paid.";
        } catch {
            document.getElementById("transferAmount").textContent =
                "Order details unavailable";
            status.textContent = "Please return to checkout and try again.";
            document.getElementById("copyAccount").disabled = true;
        }

        document.getElementById("copyAccount").addEventListener("click", async () => {
            const account = document.getElementById("accountNumber").textContent.trim();

            if (!/^\d{10}$/.test(account)) {
                alert("Please configure your real 10-digit account number first.");
                return;
            }

            try {
                await navigator.clipboard.writeText(account);
                alert("Account number copied.");
            } catch {
                alert("Please copy the account number manually.");
            }
        });
    })();
    </script>
</body>
</html>
